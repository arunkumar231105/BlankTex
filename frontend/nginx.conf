server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;  # allow large CSV uploads

    # Proxy API calls to the backend container on the internal docker network.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Preserve the identity asserted by the host-level Authentik forward
        # auth proxy. The API validates the shared secret before trusting it.
        proxy_set_header X-Authentik-Username $http_x_authentik_username;
        proxy_set_header X-Authentik-Groups $http_x_authentik_groups;
        proxy_set_header X-Authentik-Email $http_x_authentik_email;
        proxy_set_header X-Authentik-Name $http_x_authentik_name;
        proxy_set_header X-Authentik-Uid $http_x_authentik_uid;
        proxy_set_header X-Decoinks-SSO-Secret $http_x_decoinks_sso_secret;
    }

    # Single-page app: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
